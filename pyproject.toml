[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-algo-trader"
version = "0.1.0"
description = "Sentiment-based algorithmic trading system for Indian stock markets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Algo Trader"}
]
keywords = ["trading", "algorithmic-trading", "sentiment-analysis", "stocks", "india", "nse", "bse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Broker Integration
    "growwapi>=1.5.0",

    # Data & Analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.25.0",

    # Sentiment Analysis & NLP
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "nltk>=3.8.0",
    "textblob>=0.17.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # Scheduling & Async
    "apscheduler>=3.10.0",
    "asyncio-throttle>=1.0.0",

    # Configuration
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Visualization & Reporting
    "plotly>=5.18.0",
    "rich>=13.7.0",

    # API (Dashboard)
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",

    # Utilities
    "loguru>=0.7.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
backtest = [
    "vectorbt>=0.26.0",
    "yfinance>=0.2.0",
]

[project.scripts]
algo-trade = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
